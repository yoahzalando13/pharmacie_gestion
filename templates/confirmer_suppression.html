{% extends "base.html" %}
{% block title %}Confirmation{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card carte-stat">
      <div class="card-body p-4 text-center">
        <span class="icone-hero danger"><i class="bi bi-exclamation-octagon"></i></span>
        <h1 class="h5 mt-3">{{ titre }}</h1>
        <p class="text-muted">{{ message }}</p>
        <form method="post" class="d-flex gap-2 justify-content-center">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Confirmer</button>
          <a href="{{ url_retour }}" class="btn btn-outline-secondary">Annuler</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
