{% if page.has_other_pages %}
<nav class="mt-3">
  <ul class="pagination justify-content-center">
    {% if page.has_previous %}
      <li class="page-item"><a class="page-link" href="?{{ params }}{% if params %}&{% endif %}page=1">«</a></li>
      <li class="page-item"><a class="page-link" href="?{{ params }}{% if params %}&{% endif %}page={{ page.previous_page_number }}">‹</a></li>
    {% endif %}
    <li class="page-item disabled">
      <span class="page-link">Page {{ page.number }} / {{ page.paginator.num_pages }}</span>
    </li>
    {% if page.has_next %}
      <li class="page-item"><a class="page-link" href="?{{ params }}{% if params %}&{% endif %}page={{ page.next_page_number }}">›</a></li>
      <li class="page-item"><a class="page-link" href="?{{ params }}{% if params %}&{% endif %}page={{ page.paginator.num_pages }}">»</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
